name: Live API tests

on:
  workflow_dispatch:
    inputs:
      confirm_cost:
        description: Type RUN LIVE TESTS to confirm use of credentials and possible API charges
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-api:
    if: ${{ inputs.confirm_cost == 'RUN LIVE TESTS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action implementation
        with:
          toolchain: stable
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Require the live API credential
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
        run: test -n "$RUNWAYML_API_SECRET"
      - name: Run ignored live API tests serially
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
        run: cargo test --locked --all-features --test live_api -- --ignored --test-threads=1 --nocapture
